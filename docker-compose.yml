services:
  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./config/config.docker.yaml:/app/config/config.yaml:ro
    depends_on:
      - backend1
      - backend2
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend1:
    image: nginx:alpine
    volumes:
      - ./deploy/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/backend/backend1.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  backend2:
    image: nginx:alpine
    volumes:
      - ./deploy/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/backend/backend2.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles:
      - redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
      - monitoring
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
